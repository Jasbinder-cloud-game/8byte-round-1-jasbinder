name: Terraform

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Verify AWS authentication
        run: aws sts get-caller-identity
