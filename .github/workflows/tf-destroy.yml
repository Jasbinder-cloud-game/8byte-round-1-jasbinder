name: Terraform Destroy

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub UI

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    # Optional: Add an environment protection rule so someone has to approve the destroy
    # environment: production 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::929746712415:role/terraform-auth
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      # Recommended: See what will be destroyed before actually doing it
      - name: Terraform Plan Destroy
        run: terraform plan -destroy -no-color

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
